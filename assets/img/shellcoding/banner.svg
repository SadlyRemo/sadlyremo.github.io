<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5a0" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00e5a0" stop-opacity="1"/>
      <stop offset="80%" stop-color="#5b8def" stop-opacity="1"/>
      <stop offset="100%" stop-color="#5b8def" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#5b8def" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="60" y1="0" x2="60" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/><line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/><line x1="1140" y1="0" x2="1140" y2="630"/>
    <line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- Hex rain columns (left side) -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#00e5a0" opacity="0.08">
    <text x="30" y="40">89 E5 81 C4</text>
    <text x="30" y="60">F0 F9 FF FF</text>
    <text x="30" y="80">31 C9 64 8B</text>
    <text x="30" y="100">71 30 8B 76</text>
    <text x="30" y="120">0C 8B 76 1C</text>
    <text x="30" y="140">8B 5E 08 8B</text>
    <text x="30" y="160">7E 20 8B 36</text>
    <text x="30" y="180">66 39 4F 18</text>
    <text x="30" y="200">75 F2 EB 06</text>
    <text x="30" y="220">5E 89 75 04</text>
    <text x="30" y="240">EB 54 E8 F5</text>
    <text x="30" y="260">FF FF FF 60</text>
    <text x="30" y="280">8B 43 3C 8B</text>
    <text x="30" y="300">7C 18 78 01</text>
    <text x="30" y="320">DF 8B 4F 18</text>
    <text x="30" y="340">8B 47 20 01</text>
  </g>

  <!-- Hex rain columns (right side) -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#5b8def" opacity="0.08">
    <text x="1070" y="290">D8 89 45 FC</text>
    <text x="1070" y="310">E3 34 49 8B</text>
    <text x="1070" y="330">45 FC 8B 34</text>
    <text x="1070" y="350">88 01 DE 31</text>
    <text x="1070" y="370">C0 99 FC AC</text>
    <text x="1070" y="390">84 C0 74 07</text>
    <text x="1070" y="410">C1 CA 0D 01</text>
    <text x="1070" y="430">C2 EB F4 3B</text>
    <text x="1070" y="450">54 24 24 75</text>
    <text x="1070" y="470">E1 8B 57 24</text>
    <text x="1070" y="490">01 DA 66 8B</text>
    <text x="1070" y="510">0C 4A 8B 57</text>
    <text x="1070" y="530">1C 01 DA 8B</text>
    <text x="1070" y="550">04 8A 01 D8</text>
    <text x="1070" y="570">89 44 24 1C</text>
    <text x="1070" y="590">61 C3 00 00</text>
  </g>

  <!-- Accent line top -->
  <rect x="100" y="160" width="1000" height="2" fill="url(#accentLine)" rx="1"/>

  <!-- Badge -->
  <rect x="460" y="130" width="280" height="30" rx="15" fill="none" stroke="#00e5a0" stroke-width="1" opacity="0.6"/>
  <text x="600" y="150" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#00e5a0" letter-spacing="3" opacity="0.8">x86  ·  WINDOWS  ·  ASSEMBLY</text>

  <!-- Main title -->
  <text x="600" y="240" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="52" font-weight="bold" fill="#e2e8f0" filter="url(#glow)">SHELLCODING</text>
  <text x="600" y="290" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#8892a8" letter-spacing="6">FROM ZERO TO CUSTOM PAYLOADS</text>

  <!-- Accent line bottom -->
  <rect x="200" y="310" width="800" height="1.5" fill="url(#accentLine)" rx="1"/>

  <!-- Register strip -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="13" opacity="0.7">
    <text x="195" y="355"><tspan fill="#5b8def" font-weight="bold">EBP</tspan><tspan fill="#6e7a8a"> var_table</tspan></text>
    <text x="345" y="355"><tspan fill="#5b8def" font-weight="bold">EBX</tspan><tspan fill="#6e7a8a"> dll_base</tspan></text>
    <text x="490" y="355"><tspan fill="#5b8def" font-weight="bold">ESI</tspan><tspan fill="#6e7a8a"> peb_walk</tspan></text>
    <text x="635" y="355"><tspan fill="#5b8def" font-weight="bold">EDI</tspan><tspan fill="#6e7a8a"> export_tbl</tspan></text>
    <text x="790" y="355"><tspan fill="#5b8def" font-weight="bold">EDX</tspan><tspan fill="#6e7a8a"> ror13_hash</tspan></text>
  </g>

  <!-- Mini PEB chain diagram -->
  <g transform="translate(160, 400)" font-family="Consolas, 'Courier New', monospace">
    <rect x="0" y="0" width="90" height="40" rx="5" fill="none" stroke="#5b8def" stroke-width="1.2" opacity="0.5"/>
    <text x="45" y="17" text-anchor="middle" fill="#5b8def" font-size="10" font-weight="bold" opacity="0.7">TEB</text>
    <text x="45" y="32" text-anchor="middle" fill="#6e7a8a" font-size="9" opacity="0.5">fs:[0x30]</text>

    <line x1="90" y1="20" x2="120" y2="20" stroke="#00e5a0" stroke-width="1.2" opacity="0.4"/>
    <polygon points="117,16 124,20 117,24" fill="#00e5a0" opacity="0.4"/>

    <rect x="125" y="0" width="90" height="40" rx="5" fill="none" stroke="#5b8def" stroke-width="1.2" opacity="0.5"/>
    <text x="170" y="17" text-anchor="middle" fill="#5b8def" font-size="10" font-weight="bold" opacity="0.7">PEB</text>
    <text x="170" y="32" text-anchor="middle" fill="#6e7a8a" font-size="9" opacity="0.5">+0x0C</text>

    <line x1="215" y1="20" x2="245" y2="20" stroke="#00e5a0" stroke-width="1.2" opacity="0.4"/>
    <polygon points="242,16 249,20 242,24" fill="#00e5a0" opacity="0.4"/>

    <rect x="250" y="0" width="110" height="40" rx="5" fill="none" stroke="#5b8def" stroke-width="1.2" opacity="0.5"/>
    <text x="305" y="17" text-anchor="middle" fill="#5b8def" font-size="10" font-weight="bold" opacity="0.7">PEB_LDR</text>
    <text x="305" y="32" text-anchor="middle" fill="#6e7a8a" font-size="9" opacity="0.5">+0x1C</text>

    <line x1="360" y1="20" x2="390" y2="20" stroke="#00e5a0" stroke-width="1.2" opacity="0.4"/>
    <polygon points="387,16 394,20 387,24" fill="#00e5a0" opacity="0.4"/>

    <rect x="395" y="0" width="120" height="40" rx="5" fill="none" stroke="#00e5a0" stroke-width="1.5" opacity="0.6"/>
    <text x="455" y="17" text-anchor="middle" fill="#00e5a0" font-size="10" font-weight="bold" opacity="0.8">kernel32.dll</text>
    <text x="455" y="32" text-anchor="middle" fill="#00e5a0" font-size="9" opacity="0.5">EBX = base</text>
  </g>

  <!-- Mini code snippet -->
  <g transform="translate(160, 475)" font-family="Consolas, 'Courier New', monospace" font-size="11" opacity="0.35">
    <text x="0" y="0" fill="#5b8def">find_function:</text>
    <text x="20" y="18" fill="#e2e8f0">mov   eax, [ebx+0x3c]</text>
    <text x="20" y="36" fill="#e2e8f0">mov   edi, [ebx+eax+0x78]</text>
    <text x="20" y="54" fill="#e2e8f0">add   edi, ebx</text>
    <text x="350" y="0" fill="#5b8def">compute_hash:</text>
    <text x="370" y="18" fill="#e2e8f0">lodsb</text>
    <text x="370" y="36" fill="#00e5a0">ror   edx, 0x0d</text>
    <text x="370" y="54" fill="#e2e8f0">add   edx, eax</text>
    <text x="600" y="0" fill="#6e7a8a">; ROR-13 hash loop</text>
    <text x="600" y="18" fill="#6e7a8a">; rotate right 13</text>
    <text x="600" y="36" fill="#6e7a8a">; accumulate char</text>
    <text x="600" y="54" fill="#6e7a8a">; position-independent</text>
  </g>

  <!-- Bottom accent -->
  <rect x="100" y="560" width="1000" height="1" fill="url(#accentLine)" rx="1" opacity="0.5"/>

  <!-- Author -->
  <text x="600" y="590" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#6e7a8a">
    <tspan fill="#00e5a0" font-weight="bold">@Rem01x</tspan>
    <tspan>  ·  Exploit Development  ·  Educational</tspan>
  </text>

  <!-- Corner decorations -->
  <path d="M 0,0 L 60,0 L 60,3 L 3,3 L 3,60 L 0,60 Z" fill="#00e5a0" opacity="0.15"/>
  <path d="M 1200,0 L 1140,0 L 1140,3 L 1197,3 L 1197,60 L 1200,60 Z" fill="#00e5a0" opacity="0.15"/>
  <path d="M 0,630 L 60,630 L 60,627 L 3,627 L 3,570 L 0,570 Z" fill="#5b8def" opacity="0.15"/>
  <path d="M 1200,630 L 1140,630 L 1140,627 L 1197,627 L 1197,570 L 1200,570 Z" fill="#5b8def" opacity="0.15"/>
</svg>
