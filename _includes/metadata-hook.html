<!-- ============================================================
     "Sumi & Shu" theme — web fonts
     Injected into <head> via Chirpy's supported metadata-hook.
       · Headings / site title : Shippori Mincho  (mincho serif)
       · Body                  : Zen Kaku Gothic New (clean, readable)
       · Code / monospace      : JetBrains Mono   (legible)
     Google Fonts serves Latin subsets via unicode-range, so English
     pages download only the Latin glyphs. display=swap avoids FOIT.
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
>
